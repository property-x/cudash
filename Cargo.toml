[package]
name = "cudash"
version = "0.3.0"
edition = "2024"
description = "A minimal and safe api over the vulkan toolkit. Inspired by cudarc's basic driver API with optional interop."
license = "Apache-2.0"
repository = "https://github.com/property-x/cudash"
keywords = ["gpu", "vulkan", "cuda"]
categories = ["api-bindings", "hardware-support", "memory-management", "science"]

[dependencies]
# Switch between stable and rolling release of ash with `ash_latest` feature.
ash = "0.38"
ash_latest = { package = "ash", git = "https://github.com/ash-rs/ash", optional = true }

# only needed for interop but can be enabled on non-Nvidia hardware as well.
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }

[features]
# On by default. Enables `cudash::interop` and the cudarc dependency, and adds `cudarc_compat` to the prelude.
# Even with it should run on any GPU without the interop.
default = ["cuda", "kernel_debug"]
cuda = ["dep:cudarc"]
# On by default. Compiles the Slang kernels with `-g`, so RenderDoc shows their source and can step
# through a thread. This embeds the kernel source in the SPIR-V: turn it off for builds you ship.
kernel_debug = []
# Off by default. Adds APIs that are still being tried out and may change: `GpuStream::set_batching` and `flush`.
experimental = []
# Allows us to use latest ash features
ash_latest = ["dep:ash_latest"]

[dev-dependencies]
cucumber = "0.23"
# Checks the SPIR-V capability numbers in src/driver/extensions.rs.
spirv = "0.4.0"
# Tests compile kernels with NVRTC (cudarc::nvrtc). Dev-only, so library users don't get it.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }
# Examples bracket a frame for RenderDoc. Dev-only, so library users don't get it.
renderdoc = "0.12.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# Driver-only benches. They run on any Vulkan 1.3 GPU, so they need no cuda feature.
[[bench]]
name = "launch"
harness = false

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "submit_cost"
harness = false

[[bench]]
name = "launch_cost"
harness = false

[[bench]]
name = "submit_strategy"
harness = false

[[bench]]
name = "batching"
harness = false
required-features = ["experimental"]

[[test]]
name = "interop_kernels"
required-features = ["cuda"]

[[test]]
name = "interop_memory"
required-features = ["cuda"]

[[test]]
name = "interop_roundtrip"
required-features = ["cuda"]

[[test]]
name = "interop_transfers"
required-features = ["cuda"]

[[test]]
name = "interop_slang"
required-features = ["cuda"]

[[example]]
name = "slang_spirv"

[[example]]
name = "slang_cudarc"
required-features = ["cuda"]

[[example]]
name = "slang_interop"
required-features = ["cuda"]

[[test]]
name = "features"
harness = false
